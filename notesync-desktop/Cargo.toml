[package]
name = "notesync-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.13", features = ["tokio", "advanced"] }
lucide-icons = { version = "1.78", features = ["iced"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4"] }
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "time"] }
